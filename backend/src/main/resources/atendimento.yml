# Configuração dos módulos de atendimentos e base de conhecimento (importada pelo application.yml).
# Os valores desta máquina vão em config/application.yml (fora do Git), como o resto da configuração:
# lá eles têm prioridade sobre os daqui. Cada chave passa a ser usada na etapa indicada.

atendimento:
  armazenamento:
    # PDF, anexos, ligações, vídeos, prints e imagens geradas; base/ guarda as imagens da base de conhecimento
    # (o "ponto backup" copia base/ e a chave mestra)
    diretorio: ${PONTO_ATENDIMENTOS_DIR:${user.home}/.conferencia-ponto/atendimentos}
    espaco-minimo: 200MB                     # abaixo disso no disco, downloads e envios param (DISCO_CHEIO)
  chave-mestra:
    arquivo: ${atendimento.armazenamento.diretorio}/chave-mestra   # cifra as chaves do Gemini (E3)
  retencao:                                  # (E5)
    dias-arquivos: 30                        # PDF, anexos, ligações, vídeo e prints
    dias-textos: 180                         # análises, linha do tempo e saídas
    cron: "0 30 3 * * *"                     # limpeza diária às 03:30
  pdf:
    tamanho-maximo: 50MB                     # PDF da conversa (E4)
  envio:
    tamanho-maximo:                          # arquivos enviados pela tela (E5)
      imagem: 50MB
      audio: 500MB
      video: 2GB
      documento: 50MB
  digisac:
    # de onde os anexos podem ser baixados (o link vem de um arquivo enviado pelo usuário)
    hosts-permitidos:
      - "*.compat.objectstorage.sa-vinhedo-1.oraclecloud.com"
  download:                                  # (E5)
    paralelos: 4
    tempo-conexao: 10s
    tempo-leitura: 60s                       # sem receber nada por este tempo, a conexão é retomada
    tamanho-maximo: 2GB                      # limite da Files API do Gemini
    tentativas: 5                            # por anexo, contando a primeira
  fila:                                      # (E5)
    trabalhadores: 8                         # tarefas ao mesmo tempo, no total
    por-usuario: 4                           # e por usuário (limite de requisições do Gemini é por projeto)
    prazo-execucao: 15m                      # tarefa "executando" há mais tempo volta para a fila (renovado enquanto roda)
    varredura: 2s
    espera-inicial: 10s                      # depois de uma falha passageira; dobra a cada tentativa
    espera-maxima: 10m
    ativa: true                              # false desliga o processamento em segundo plano
  gemini:
    url-base: https://generativelanguage.googleapis.com
    exigir-nivel-pago: true                  # o usuário confirma que a chave é de projeto com faturamento (E3)
    tempo-conexao: 10s                       # para abrir a conexão com o Google
    tempo-teste: 20s                         # para o teste da chave responder
    modelos:                                 # nomes na configuração: troca sem mexer no código (E6)
      analise: gemini-3.8-flash              # imagem e documento
      audio: gemini-3.8-flash                # transcrição (a comparar com gemini-3.5-transcribe na validação)
      redacao: gemini-3.8-flash
    tentativas: 5                            # por arquivo, contando a primeira (o 429 por minuto espera o tempo pedido)
    tempo-limite: 10m                        # resposta de uma análise (áudio longo demora)
    tempo-envio: 2m                          # cada pedaço de 8 MB do envio de um arquivo
    espera-arquivo: 5m                       # o Google preparar o áudio ou o documento enviado
    intervalo-consulta: 2s
    inline-maximo: 15MB                      # imagem até este tamanho vai no próprio pedido; acima, pela Files API
    max-tokens-saida: 32768
    temperatura:                             # vazio = a do modelo (nos Gemini 3 o Google recomenda não baixar)
    raciocinio:                              # nível de raciocínio (ex.: low); vazio = o padrão do modelo
    video:
      quadros-por-segundo: 1                 # (E9)
  ffmpeg:
    caminho:                                 # vazio = procurar no PATH (E9)
  imagens:
    marcacoes: false                         # marcações em vermelho, experimental (E12)

conhecimento:
  vetor:                                     # pesquisa por significado (E11)
    modelo: gemini-embedding-2
    dimensao: 768
  parecidos:
    limite: 5
    similaridade-minima: 0.75                # ajustada na validação

spring:
  application:
    name: conferencia-ponto
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/conferencia_ponto}
    username: ${DB_USER:ponto}
    password: ${DB_PASSWORD:ponto}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o schema é responsabilidade exclusiva do Flyway
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB        # relatório de banco de horas do RH (conciliação)
      max-request-size: 11MB

server:
  port: ${PORT:8080}

ponto:
  fuso-horario: America/Sao_Paulo
  tolerancia-minutos: 5
  grade:
    entrada1: "08:00"
    saida1: "12:00"
    entrada2: "13:00"
    saida2: "17:48"
  cors-origens-permitidas:
    - http://localhost:5173

  # Banco de horas semestral: o saldo do painel é o do ciclo aberto. O botão "Fechar banco de horas"
  # congela o saldo e recomeça do zero. Avisos 30 e 15 dias antes da previsão de fechamento.
  banco-horas:
    inicio-primeiro-ciclo: 2026-05-25   # usado só na primeira subida; depois, corrija pela tela
    duracao-meses: 6
    cron-alertas: "0 0 1 * * *"         # conferência diária dos prazos (01:00)

  # Importação automática dos comprovantes (PDF) baixados do Ponto Fácil
  importacao-pdf:
    habilitado: ${PONTO_PDF_HABILITADO:true}
    # Cada usuário escolhe a própria pasta em "Minha conta" (local ou de rede, ex.: //192.168.0.10/Ponto).
    # Este valor só é usado uma vez: na atualização para vários usuários, se ninguém tiver pasta, ela passa
    # a ser a pasta do primeiro administrador.
    diretorio: ${PONTO_PDF_DIR:}
    processar-existentes: true      # ao iniciar, importa PDFs que já estavam na pasta (sem duplicar)
    varredura-periodica: 30s        # confere a pasta mesmo sem aviso do Windows (pasta de rede); 0 desliga
    intervalo-reconexao: 15s        # pasta inacessível (VPN caiu, outro PC desligado): tenta de novo
    estabilizacao: 300ms            # confirma que o download terminou (tamanho estável)
    tentativas-leitura: 20
    intervalo-tentativa: 500ms
    tamanho-maximo: 10MB
    # regex: precisa dos grupos (?<data>dd/MM/yyyy) e (?<hora>HH:mm[:ss]); o padrão cobre
    #        "Comprovante de Ponto - dd/MM/yyyy HH:mm:ss"

  # Arquivo dos PDFs de comprovante (fora do banco): <diretorio>/<ano>/<mês>/comprovante_<uuid>.pdf
  armazenamento:
    diretorio: ${PONTO_ARMAZENAMENTO_DIR:${user.home}/.conferencia-ponto/comprovantes}
    url-base: /api/comprovantes

  seguranca:
    jwt:
      segredo: ${PONTO_JWT_SEGREDO:}   # >= 32 caracteres; vazio = chave aleatória a cada subida
      expiracao: 8h
      emissor: conferencia-ponto
    # Criados na primeira subida, se não existirem. Senha vazia = gerada e exibida uma vez no log.
    # Para usar outros logins/nomes, redefina a lista inteira em config/application.yml.
    usuarios-iniciais:
      - login: admin
        nome: Administrador
        senha: ${PONTO_ADMIN_SENHA:}
        perfis: [ROLE_ADMIN]
      - login: coordenacao
        nome: Coordenação
        senha: ${PONTO_VIEWER_SENHA:}
        perfis: [ROLE_VIEWER]

logging:
  level:
    br.com.conferenciaponto.infrastructure.importacao: INFO

services:
  postgres:
    image: postgres:16-alpine
    container_name: expedio-db
    environment:
      POSTGRES_DB: expedio
      POSTGRES_USER: expedio
      POSTGRES_PASSWORD: expedio
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expedio -d expedio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

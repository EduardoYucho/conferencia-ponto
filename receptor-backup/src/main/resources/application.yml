# Receptor de backup: configuração padrão. A da máquina fica em config\application.yml na pasta de instalação
# (gerada por "receptor instalar") e prevalece sobre esta.
server:
  # A tela do Receptor (só nesta máquina)
  port: ${receptor.porta-admin}
  address: 127.0.0.1
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
  tomcat:
    # Os pedaços chegam pelo corpo da requisição; o tamanho é conferido pelo próprio Receptor
    max-swallow-size: -1
    connection-timeout: 120s

spring:
  application:
    name: receptor-backup
  jackson:
    default-property-inclusion: non_null
  mvc:
    async:
      request-timeout: 300s

receptor:
  # Onde ficam os backups: <pasta>\<Cliente>\<Cliente>_<data>.tar.zst
  pasta-dados: ${user.home}/Backups-Clientes
  # Tela do Receptor (só localhost) e porta que o túnel publica (só /c/...)
  porta-admin: 8095
  porta-publica: 8096
  # Endereço público fixo (túnel nomeado com domínio próprio). Vazio = túnel rápido do cloudflared, se instalado.
  endereco-publico: ""
  # Caminho do cloudflared.exe. Vazio = procura no PATH e nas pastas de instalação comuns.
  cloudflared: ""
  # O link vale por esse tempo sem contato (cada contato da página renova)
  validade-link-horas: 48
  # Nível do zstd usado pelo navegador do cliente (1 a 19). Medido em registros parecidos com .DAT do DataFlex
  # (blocos de 8 MB, por núcleo): 15 = 40 MB/s e 20x; 17 = 17 MB/s e 35x; 19 = 1,4 MB/s e 37x. O 17 compacta quase
  # igual ao 19 e lê uma base de 10 GB em minutos, não em horas.
  nivel-zstd: 17
  # Tamanho de cada bloco lido antes de compactar (MiB). Cada bloco vira um pedaço do envio.
  tamanho-bloco-mib: 8
  # Maior pedaço aceito (MiB, já compactado)
  max-parte-mib: 32
  # Não aceita pedaço se o disco ficar com menos que isso livre (MiB)
  espaco-minimo-livre-mib: 2048
  # Limpeza automática: apaga coletas concluídas com mais de N dias (0 = desligada)
  limpeza-dias: 0
  # Na limpeza, mantém sempre a coleta mais recente de cada cliente
  manter-ultima-por-cliente: true

logging:
  level:
    root: INFO
